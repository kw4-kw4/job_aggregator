# config/default_rules.yaml — ЧЕРНОВИК v1, собран из "Выжимка_требований_к_работе.pdf"
#
# Как читать:
#   category:  HARD_REJECT (абсолютный запрет) | SOFT_PENALTY (минус к score) | POSITIVE (плюс к score) | RISK (для risk engine)
#   match:     lemma  — фраза по леммам нормализованного текста (ё→е, регистр, словоформы)
#              regex  — регулярное выражение по нормализованному тексту
#              struct — условие на результат extraction (см. поле condition)
#   negation:  ignore            — при отрицании правило просто не срабатывает
#              flip_to: <CODE>   — при отрицании срабатывает другой код (например, "без звонков" -> NO_CALLS)
#   group/cap: для POSITIVE — группа, внутри которой сумма плюсов ограничена капом (см. scoring.yaml)
#   text_ru:   текст причины для бота
#
# Все фразы ниже — стартовый набор. Его нужно расширять по реальным вакансиям
# (см. docs/scoring.md, раздел "тюнинг правил").

version: 1

defaults:
  user_settings:
    timezone: Asia/Yekaterinburg       # Екатеринбург, МСК+2
    remote_only: true
    min_relevance_score: 70
    max_risk_level: LOW
    max_age_hours: 72
    min_salary_monthly: 20000
    min_salary_currency: RUB
    quiet_hours: {start: "23:00", end: "08:00"}
    quiet_policy: QUEUE_AND_SEND_LATER
    max_notifications_per_minute: 3
    max_notifications_per_hour: 20
    digest_threshold: 8

# ─────────────────────────── HARD REJECT ───────────────────────────
hard_reject:

  - code: VIDEO_EDITING
    text_ru: "видеомонтаж"
    match: lemma
    patterns: ["видеомонтаж", "монтаж видео", "монтажер видео", "видеомонтажер", "монтажер reels", "монтаж reels", "монтаж shorts", "motion дизайнер", "after effects", "premiere pro", "davinci resolve", "capcut", "монтаж рилс", "монтаж роликов"]
    negation: ignore                   # "без видеомонтажа" -> просто не срабатывает

  - code: COLD_CALLS
    text_ru: "холодные звонки / звонки клиентам"
    match: lemma
    patterns: ["холодный звонок", "холодные звонки", "обзвон", "обзванивать", "звонить клиентам", "звонки клиентам", "исходящие звонки", "обработка входящих звонков", "прием звонков", "колл центр", "оператор call центра", "телефонные продажи", "продажи по телефону", "активные продажи"]
    negation: {flip_to: NO_CALLS}

  - code: CALLS_REQUIRED
    text_ru: "обязательны созвоны / видеозвонки"
    match: lemma
    patterns: ["обязательные созвоны", "регулярные созвоны", "регулярный созвон", "ежедневные созвоны", "созвон каждый день", "ежедневный созвон", "ежедневная планерка", "ежедневный стендап", "созвоны несколько раз в неделю", "созвоны 2 3 раза в неделю", "созвоны 2 раза в неделю", "созвоны 3 раза в неделю", "планерка по видеосвязи", "видеозвонок", "видеособеседование каждый", "работа на камеру", "включенная камера", "участие в звонках", "созвоны с заказчиком", "созвоны с клиентами", "общение по телефону", "общение по видеосвязи"]
    negation: {flip_to: NO_CALLS}
    # Регулярные созвоны (каждый день, несколько раз в неделю) — hard reject.
    # Еженедельный / "раз в неделю" — терпимо, см. WEEKLY_CALL в soft_penalty.

  - code: OFFICE_WORK
    text_ru: "работа в офисе"
    match: struct
    condition: {remote: OFFICE, when_setting: remote_only}   # только при включённом "Remote only"

  - code: PHYSICAL_LABOR
    text_ru: "физическая работа"
    match: lemma
    patterns: ["грузчик", "курьер", "упаковщик", "разнорабочий", "комплектовщик", "фасовщик", "уборщик", "склад", "сборщик заказов", "промоутер", "расклейщик", "листовки", "раздача листовок"]
    negation: ignore

  - code: BUSINESS_TRIPS_REQUIRED
    text_ru: "обязательные командировки"
    match: lemma
    patterns: ["командировка", "разъездной характер", "выезд к клиентам", "выездная работа", "постоянные разъезды"]
    negation: {flip_to: NO_TRIPS}

  - code: PAYMENT_REQUIRED
    text_ru: "нужно платить за трудоустройство"
    match: lemma
    patterns: ["вступительный взнос", "стартовый взнос", "платное трудоустройство", "залог", "оплата обучения", "платное обучение", "внести деньги", "купить пакет", "купить доступ", "оплатить доступ", "оплатить обучение", "оплатить курс", "внести депозит", "оплатить регистрацию", "выкупить"]
    negation: ignore                   # "взнос не нужен" -> не срабатывает

  - code: MLM
    text_ru: "сетевой маркетинг"
    match: lemma
    patterns: ["сетевой маркетинг", "млм", "mlm", "структура", "пассивный доход", "финансовая независимость", "построение команды", "бизнес под ключ", "приглашай друзей", "привлекай партнеров", "реферальная система заработка"]
    negation: ignore

  - code: EMPLOYMENT_SCAM
    text_ru: "признаки мошеннической схемы"
    match: lemma
    patterns: ["перевод денег", "обналичивание", "дроп", "дропшиппинг карт", "получать деньги на карту и переводить", "посредник для платежей", "крипто арбитраж", "ставки на спорт", "заработок на ставках", "работа с криптовалютой без опыта", "заработок от 100 000 в неделю"]
    negation: ignore

  - code: TIME_TRACKER_STRICT
    text_ru: "жёсткий контроль времени / тайм-трекер"
    match: lemma
    patterns: ["тайм трекер", "трекер времени", "hubstaff", "time doctor", "timedoctor", "clockify обязательно", "скриншоты экрана", "контроль активности", "мониторинг активности", "мониторинг экрана", "screen recording", "запись экрана", "отчет каждый час", "отчет каждые 30 минут", "онлайн весь рабочий день"]
    negation: {flip_to: NO_TRACKING}
    # ПОДТВЕРЖДЕНО пользователем: никакого контроля активности.

  - code: LONG_HOURS
    text_ru: "8 и более часов в день"
    match: struct
    condition: {daily_hours_min_at_least: 8}
    # Extraction достаёт минимум часов в день:
    #   "8 часов" -> 8, "8-12 часов" -> 8 (min диапазона), "с 9 до 18" -> 8 (9 часов минус обед)
    #   "4-8 часов" -> 4, "5-6 часов" -> 5, "до 8 часов" -> не считается (это максимум)
    # Просто "полный рабочий день" БЕЗ числа часов — НЕ срабатывает (нейтрально).

  - code: TK_EMPLOYMENT_ONLY
    text_ru: "оформление только по ТК РФ"
    match: struct
    condition: {contract_types_found_only: [TK]}
    # ТК РФ упомянут, а НИ ОДНОЙ другой формы (самозанятость/НПД, ГПХ, ИП, договор с физлицом) нет.
    # "по ТК или ГПХ", "на выбор" -> НЕ срабатывает. Ничего не написано про оформление -> НЕ срабатывает.
    # Фразы-маркеры ТК: "по тк рф", "трудовой договор", "трудовая книжка", "официальное трудоустройство по тк",
    #   "оформление по тк", "трудоустройство по тк", "в штат", "белая зарплата по тк".
    # ОТКРЫТЫЙ ВОПРОС: голое "официальное трудоустройство" без слов "ТК/трудовой" обычно означает ТК,
    #   но не всегда; сейчас оно тег OFFICIAL_EMPLOYMENT_UNSPECIFIED без штрафа.

# ─────────────────────────── SOFT PENALTY ──────────────────────────
soft_penalty:

  - code: EXPERIENCE_REQUIRED
    text_ru: "требуется опыт"
    match: lemma
    patterns: ["опыт от", "опыт работы от", "требуется опыт", "нужен опыт", "опыт обязателен", "опыт работы обязателен", "релевантный опыт"]
    weight: -10
    negation: {flip_to: NO_EXPERIENCE_REQUIRED}
    # регекс на "от 3 лет" и выше даёт -15 (см. EXPERIENCE_3Y_PLUS)

  - code: EXPERIENCE_3Y_PLUS
    text_ru: "требуется опыт от 3 лет"
    match: regex
    patterns: ['опыт(?: работы)? от (?:3|4|5|6|7|8|9|10) (?:лет|года)', 'опыт (?:3|4|5|6|7|8|9|10)\+? лет']
    weight: -15
    replaces: EXPERIENCE_REQUIRED     # не суммируется с обычным штрафом за опыт
    negation: ignore

  # FULL_TIME_ONLY убран: "полный рабочий день" без числа часов нейтрален,
  # 8+ часов явно — hard reject LONG_HOURS выше.

  - code: WEEKLY_CALL
    text_ru: "периодические созвоны (раз в неделю и т.п.)"
    match: lemma
    patterns: ["еженедельный созвон", "созвон раз в неделю", "короткий созвон", "планерка", "митинг", "онлайн встреча", "летучка", "стендап", "созвон по необходимости", "созвоны по договоренности", "встречи с командой"]
    weight: -5
    negation: {flip_to: NO_CALLS}

  - code: LOW_SALARY
    text_ru: "зарплата ниже вашего минимума"
    match: struct
    condition: {salary_period: MONTHLY, salary_max_below_setting: min_salary_monthly}
    weight: -10
    # Сравнивается ТОЛЬКО с месячной ставкой в той же валюте. PER_ITEM/HOURLY/PROJECT не сравниваются.

  - code: SALARY_NOT_SPECIFIED
    text_ru: "зарплата не указана"
    match: struct
    condition: {salary_status: NOT_SPECIFIED}
    weight: -5

  - code: INFO_INSUFFICIENT
    text_ru: "мало информации в объявлении"
    match: struct
    condition: {description_chars_below: 200, responsibilities_found: false}
    weight: -10

  - code: HEAVY_COMMUNICATION
    text_ru: "много коммуникации с людьми"
    match: lemma
    patterns: ["активное общение", "постоянная коммуникация", "переговоры", "работа с возражениями", "коммуникабельность обязательна", "клиентский сервис", "поддержка клиентов в чате"]
    weight: -8
    negation: ignore

  - code: URGENT_FULL_AVAILABILITY
    text_ru: "требуется быть на связи в течение всего дня"
    match: lemma
    patterns: ["всегда на связи", "быть на связи 24/7", "быстро отвечать в течение 5 минут", "ответ в течение 10 минут", "оперативная реакция"]
    weight: -10
    negation: ignore

# ─────────────────────────── POSITIVE SIGNAL ───────────────────────
positive:

  # --- формат работы
  - {code: REMOTE, text_ru: "удалённая работа", match: lemma, group: WORK_FORMAT,
     patterns: ["удаленно", "удаленка", "удаленная работа", "работа из дома", "remote", "remote work", "fully remote", "дистанционно", "дистанционная работа", "онлайн работа", "из любой точки"]}

  # --- график и занятость
  - {code: PART_TIME, text_ru: "частичная занятость / подработка", match: lemma, group: SCHEDULE,
     patterns: ["подработка", "частичная занятость", "неполный день", "part time", "parttime", "4 часа в день", "5 часов в день", "2 4 часа в день", "3 4 часа в день", "на пару часов", "на несколько часов в день", "для студентов", "совмещение"]}
  - {code: FLEXIBLE_SCHEDULE, text_ru: "гибкий график", match: lemma, group: SCHEDULE,
     patterns: ["гибкий график", "свободный график", "удобный график", "работай когда удобно", "в удобное время", "самостоятельное планирование", "без привязки ко времени", "плавающий график"]}

  # --- формат оплаты
  - {code: PROJECT_BASED, text_ru: "проектная работа", match: lemma, group: PAYMENT_MODEL,
     patterns: ["проектная работа", "проектная оплата", "разовые проекты", "за проект", "оплата по факту", "по результату"]}
  - {code: PIECE_RATE, text_ru: "сдельная оплата", match: lemma, group: PAYMENT_MODEL,
     patterns: ["сдельная оплата", "сдельно", "оплата за карточку", "оплата за статью", "оплата за задачу", "оплата за 1000 знаков", "оплата за пост", "за каждую карточку", "за каждую статью"]}

  # --- коммуникация (главный критерий из PDF)
  - {code: NO_CALLS, text_ru: "без звонков", match: lemma, group: COMMUNICATION,
     patterns: ["без звонков", "без созвонов", "без видеозвонков", "без голосовых", "без встреч", "общение только в чате", "общение в мессенджере", "общение в telegram", "общение письменно", "текстовое общение", "только переписка", "звонки не требуются", "созвоны не нужны"]}
  - {code: ASYNC_COMMUNICATION, text_ru: "асинхронная коммуникация", match: lemma, group: COMMUNICATION,
     patterns: ["асинхронно", "асинхронный формат", "асинхронная работа", "без жестких дедлайнов по часам", "работа по задачам", "по договоренности в чате"]}
  - {code: NO_TRACKING, text_ru: "без тайм-трекеров и тотального контроля", match: lemma, group: COMMUNICATION,
     patterns: ["без тайм трекера", "без контроля времени", "без слежки", "не нужно отчитываться по часам", "отчет по результату"]}
  - {code: NO_EXPERIENCE_REQUIRED, text_ru: "опыт не требуется", match: lemma, group: EXPERIENCE,
     patterns: ["без опыта", "опыт не нужен", "опыт не требуется", "научим", "обучение за наш счет", "подойдет новичкам"]}

  # --- тематика (твои приоритеты из PDF)
  - {code: AI, text_ru: "работа с ИИ / нейросетями", match: lemma, group: TOPIC,
     patterns: ["искусственный интеллект", "ии", "ai", "нейросеть", "нейросети", "chatgpt", "чат gpt", "gpt", "claude", "midjourney", "stable diffusion", "промпт", "промпт инжиниринг", "prompt engineering", "ai инструменты", "генерация текстов", "генерация изображений", "llm", "ai контент"]}
  - {code: CONTENT, text_ru: "создание и редактирование контента", match: lemma, group: TOPIC,
     patterns: ["контент", "контент менеджер", "контент-менеджер", "контентмейкер", "создание контента", "редактор", "редактирование текстов", "корректор", "корректура", "копирайтер", "копирайтинг", "рерайтер", "рерайт", "блог", "статьи", "тексты для сайта", "наполнение сайта", "наполнение каталога"]}
  - {code: SEO, text_ru: "SEO и работа с текстами", match: lemma, group: TOPIC,
     patterns: ["seo", "сео", "seo текст", "seo оптимизация", "seo копирайтинг", "seo специалист", "ключевые слова", "семантическое ядро", "оптимизация текстов", "meta теги", "поисковая оптимизация", "продвижение сайта"]}
  - {code: MARKETPLACE_CARDS, text_ru: "карточки товаров для маркетплейсов", match: lemma, group: TOPIC,
     patterns: ["карточки товаров", "карточка товара", "оформление карточек", "оптимизация карточек", "wildberries", "вайлдберриз", "wb", "ozon", "озон", "яндекс маркет", "маркетплейс", "маркетплейсы", "менеджер маркетплейсов", "seo карточек", "описание товаров", "инфографика для маркетплейс"]}

# ─────────────────────────── RISK FLAGS ────────────────────────────
# Вес суммируется в risk_score (макс. 100). Hard-флаги дают HIGH независимо от суммы.
risk:
  - {code: PAYMENT_REQUIRED,        weight: 60, hard: true,  text_ru: "требуют деньги за трудоустройство/обучение"}
  - {code: MLM,                     weight: 60, hard: true,  text_ru: "признаки сетевого маркетинга"}
  - {code: EMPLOYMENT_SCAM,         weight: 60, hard: true,  text_ru: "признаки мошеннической схемы"}
  - {code: MONEY_TRANSFER,          weight: 50,              text_ru: "предлагают принимать/переводить деньги"}
  - {code: EQUIPMENT_PURCHASE,      weight: 40,              text_ru: "просят купить оборудование или доступ"}
  - {code: CRYPTO_SCHEME,           weight: 40,              text_ru: "сомнительные криптосхемы"}
  - {code: UNREALISTIC_SALARY,      weight: 30,              text_ru: "оплата заметно выше типичной для таких обязанностей"}
  - {code: VAGUE_JOB_DESCRIPTION,   weight: 20,              text_ru: "нет чётких обязанностей"}
  - {code: UNPAID_TEST_TASK,        weight: 15,              text_ru: "большое бесплатное тестовое задание"}
  - {code: URGENCY_PRESSURE,        weight: 10,              text_ru: "давление срочностью («только сегодня»)"}
  - {code: CONTACT_ONLY_MESSENGER,  weight: 10,              text_ru: "контакт только через личку без данных о работодателе"}
  - {code: NO_COMPANY_INFO,         weight: 5,               text_ru: "нет информации о заказчике"}

risk_patterns:
  UNPAID_TEST_TASK:
    patterns: ["бесплатное тестовое", "тестовое задание бесплатно", "тестовый день без оплаты", "неоплачиваемое тестовое", "оплата после испытательного срока", "стажировка без оплаты"]
  URGENCY_PRESSURE:
    patterns: ["только сегодня", "осталось мест", "торопись", "успей", "срочно набор", "последние места"]
  UNREALISTIC_SALARY:
    # в MVP: грубые пороги по типу оплаты + условие "нет требований к опыту/навыкам"
    monthly_rub_above: 150000
    hourly_rub_above: 3000
    per_item_rub_above: 15000
    requires: no_experience_and_no_skills_listed

# ─────────────────────── ДОП. СТРУКТУРНЫЕ ПРАВИЛА ───────────────────
struct_hints:
  # Формы оформления, которые extraction распознаёт (поле contract_types).
  # ПРАВИЛА (подтверждены пользователем): ТК РФ невозможен, всё остальное подходит.
  #   - есть любая форма кроме ТК            -> зелёный флаг (score не меняется)
  #   - несколько форм на выбор              -> зелёный флаг
  #   - про оформление ничего не написано    -> зелёный флаг
  #   - только ТК РФ                         -> hard reject TK_EMPLOYMENT_ONLY
  #   - "неофициально" / "без оформления"    -> нейтрально: тег UNOFFICIAL_ARRANGEMENT (weight 0),
  #                                             в сообщении показывается пометка "оформление: неофициально"
  contract_types:
    TK:   ["по тк рф", "по тк", "трудовой договор", "трудовая книжка", "трудоустройство по тк", "оформление по тк", "в штат"]
    SELF_EMPLOYED: ["самозанятый", "самозанятость", "нпд", "ип на нпд", "налог на профессиональный доход"]
    GPH:  ["гпх", "договор гпх", "договор подряда", "оказание услуг", "договор оказания услуг"]
    IP:   ["ип", "договор с ип"]
    INDIVIDUAL: ["договор с физлицом", "договор с физическим лицом", "физлицо"]
    UNOFFICIAL: ["неофициально", "без оформления", "без договора", "на доверии"]
    ANY_OFFICIAL_UNSPECIFIED: ["официальное трудоустройство", "официальное оформление"]
  tags:
    UNOFFICIAL_ARRANGEMENT: {weight: 0, text_ru: "оформление: неофициально"}
    OFFICIAL_EMPLOYMENT_UNSPECIFIED: {weight: 0, text_ru: "официальное оформление (форма не указана)"}
